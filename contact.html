<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Contact · Hello, world!</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f7ff; --muted:#b7bdd5; --glass:rgba(255,255,255,.09); }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:6.5rem 1rem 2rem; display:grid; place-items:center; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 18% 18%,rgba(99,102,241,.30),transparent 38%),radial-gradient(ellipse at 82% 78%,rgba(20,184,166,.20),transparent 36%),linear-gradient(135deg,#101426,#17152d 55%,#101c2c); }
    body::before,body::after { content:""; position:fixed; width:24rem; aspect-ratio:1; border:1px solid rgba(255,255,255,.08); border-radius:50%; pointer-events:none; }
    body::before { top:-12rem; right:-8rem; box-shadow:0 0 0 2.5rem rgba(255,255,255,.018),0 0 0 5rem rgba(255,255,255,.014); }
    body::after { bottom:-17rem; left:-10rem; width:32rem; box-shadow:0 0 0 3rem rgba(255,255,255,.018); }
    nav { position:fixed; z-index:2; top:1.25rem; left:50%; display:flex; gap:.35rem; padding:.4rem; transform:translateX(-50%); border:1px solid rgba(255,255,255,.12); border-radius:999px; background:rgba(16,20,38,.72); backdrop-filter:blur(14px); }
    nav a { padding:.6rem .9rem; border-radius:999px; color:var(--muted); font-size:.9rem; text-decoration:none; transition:color .2s,background .2s; }
    nav a:hover,nav a[aria-current="page"] { color:var(--ink); background:rgba(255,255,255,.11); }
    main { position:relative; width:min(90vw,700px); padding:clamp(2rem,6vw,4.5rem); border:1px solid rgba(255,255,255,.16); border-radius:28px; background:var(--glass); box-shadow:0 24px 80px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter:blur(18px); animation:rise .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin:0 0 .8rem; color:#a5f3e8; font-size:.75rem; font-weight:750; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.8rem,8vw,5.5rem); line-height:1; letter-spacing:-.07em; }
    h1 span { color:transparent; background:linear-gradient(90deg,#c4b5fd,#67e8d3); background-clip:text; -webkit-background-clip:text; }
    .intro { margin:1.4rem 0 2rem; color:var(--muted); font-size:1.1rem; line-height:1.7; }
    .contact-link { display:flex; align-items:center; gap:1rem; width:fit-content; max-width:100%; padding:1rem 1.15rem; border:1px solid rgba(255,255,255,.14); border-radius:16px; color:var(--ink); text-decoration:none; background:rgba(15,23,42,.25); transition:transform .2s,border-color .2s; }
    .contact-link:hover { transform:translateY(-2px); border-color:rgba(94,234,212,.5); }
    .icon { display:grid; place-items:center; width:42px; height:42px; flex:0 0 42px; border-radius:13px; color:#101426; font-size:1.2rem; background:linear-gradient(135deg,#a78bfa,#5eead4); }
    .contact-link small { display:block; margin-bottom:.2rem; color:var(--muted); }
    .contact-link strong { overflow-wrap:anywhere; }
    .note { margin:1.2rem 0 0; color:#929bb8; font-size:.9rem; }
    @keyframes rise { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <p class="eyebrow">Let’s start a conversation</p>
    <h1>Say <span>hello.</span></h1>
    <p class="intro">Have a thought, a question, or an idea to share? We’d love to hear from you.</p>
    <a class="contact-link" href="mailto:hello@example.com"><span class="icon" aria-hidden="true">✉</span><span><small>Send us an email</small><strong>hello@example.com</strong></span></a>
    <p class="note">Replace this sample address with your preferred contact email.</p>
  </main>
</body>
</html>
