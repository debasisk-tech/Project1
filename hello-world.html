<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101426">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f7ff;
      --muted: #b7bdd5;
      --glass: rgba(255, 255, 255, .09);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(99, 102, 241, .30), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(20, 184, 166, .20), transparent 36%),
        linear-gradient(135deg, #101426, #17152d 55%, #101c2c);
      padding: 2rem 1rem;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 24rem;
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -12rem; right: -8rem; box-shadow: 0 0 0 2.5rem rgba(255,255,255,.018), 0 0 0 5rem rgba(255,255,255,.014); }
    body::after { bottom: -17rem; left: -10rem; width: 32rem; box-shadow: 0 0 0 3rem rgba(255,255,255,.018); }
    main {
      position: relative;
      width: min(90vw, 700px);
      padding: clamp(2.2rem, 7vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px;
      background: var(--glass);
      box-shadow: 0 24px 80px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
    }
    nav { position: fixed; z-index: 2; top: 1.25rem; left: 50%; display: flex; gap: .35rem; padding: .4rem; transform: translateX(-50%); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(16,20,38,.72); backdrop-filter: blur(14px); }
    nav a { padding: .6rem .9rem; border-radius: 999px; color: var(--muted); font-size: .9rem; text-decoration: none; transition: color .2s, background .2s; }
    nav a:hover, nav a[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.11); }
    .sparkle { display: inline-grid; place-items: center; width: 56px; height: 56px; margin-bottom: 1.4rem; border-radius: 18px; font-size: 1.5rem; background: linear-gradient(135deg, #a78bfa, #5eead4); box-shadow: 0 8px 30px rgba(94,234,212,.22); }
    .eyebrow { margin: 0 0 .8rem; color: #a5f3e8; font-size: .75rem; font-weight: 750; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.2rem, 10vw, 6.5rem); line-height: .98; letter-spacing: -.075em; }
    h1 span { color: transparent; background: linear-gradient(90deg, #c4b5fd, #67e8d3); background-clip: text; -webkit-background-clip: text; }
    .intro { max-width: 34rem; margin: 1.4rem auto 0; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.7; }
    .rule { width: 52px; height: 3px; margin: 2rem auto; border-radius: 3px; background: linear-gradient(90deg, #a78bfa, #5eead4); }
    .tag { display: inline-flex; align-items: center; gap: .55rem; padding: .65rem .95rem; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; color: #e0e7ff; font-size: .85rem; background: rgba(15,23,42,.28); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #5eead4; box-shadow: 0 0 12px #5eead4; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <a href="hello-world.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little page with big energy</p>
    <h1>Hello,<br><span>world!</span></h1>
    <p class="intro">A fresh start, a blank canvas, and a whole world of possibilities. Here’s to making something wonderful.</p>
    <div class="rule" aria-hidden="true"></div>
    <span class="tag"><span class="dot" aria-hidden="true"></span>Ready for what’s next</span>
  </main>
</body>
</html>
